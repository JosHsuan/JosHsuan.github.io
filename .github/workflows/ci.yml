name: Validate static export
on:
  push:
    branches-ignore: ['preflight/**']
  pull_request:
  workflow_dispatch:
    inputs:
      full_validation:
        description: Run all framework and public-case checks
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
concurrency:
  group: validate-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
env:
  NEXT_TELEMETRY_DISABLED: '1'
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      framework: ${{ steps.plan.outputs.framework }}
      pages: ${{ steps.plan.outputs.pages }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Check impact selection and publication gates
        run: node --test tests/ci/*.test.mjs
      - name: Select affected checks
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-plan.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: validation-plan
          path: ci-plan.json
          retention-days: 14

  quality:
    needs: plan
    if: needs.plan.outputs.framework == 'true' || needs.plan.outputs.pages == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate content, lint, types and fast regression tests once
        run: pnpm content:validate && pnpm lint && pnpm typecheck && pnpm test
      - name: Public case and role tooling portable tests
        if: needs.plan.outputs.pages == 'true'
        run: node --test roles/uiux-designer/cases/bending-active-thesis/tests/*.test.mjs roles/uiux-designer/tools/*.test.mjs

  framework:
    needs: plan
    if: needs.plan.outputs.framework == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright@sha256:bc6ab0d6d44ff4826e4cb8c1e6d801e185bfc42bb0753f8e2a30efc70db054c7
      options: --user pwuser --shm-size=1g
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: root
            basePath: ''
          - name: subpath
            basePath: /portfolio-test
    env:
      CI_QUALIFICATION_IMAGE: mcr.microsoft.com/playwright@sha256:bc6ab0d6d44ff4826e4cb8c1e6d801e185bfc42bb0753f8e2a30efc70db054c7
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      NEXT_PUBLIC_BASE_PATH: ${{ matrix.basePath }}
    steps:
      - name: Require nonroot identity and writable runner mounts
        shell: bash
        run: |
          set -euo pipefail
          id
          test "$(id -u)" -ne 0
          test "$(id -un)" = pwuser
          for directory in "$GITHUB_WORKSPACE" "$HOME" "$RUNNER_TEMP" "$RUNNER_TOOL_CACHE"; do
            printf 'Checking writable directory: %s\n' "$directory"
            test -d "$directory"
            test -w "$directory"
          done
          printf 'Checking writable environment file: %s\n' "$GITHUB_ENV"
          test -w "$GITHUB_ENV"
          printf 'Checking writable path file: %s\n' "$GITHUB_PATH"
          test -w "$GITHUB_PATH"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify pinned browser environment
        run: node scripts/ci-image-fingerprint.mjs
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-image-bc6ab0d6d44f-framework-${{ matrix.name }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-image-bc6ab0d6d44f-framework-${{ matrix.name }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report-${{ matrix.name }}
          path: |
            playwright-report/
            test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: static-export-${{ matrix.name }}
          path: out/
          include-hidden-files: true
          retention-days: 14
      - name: Retain browser environment evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-environment-framework-${{ matrix.name }}
          path: preflight-results/image-fingerprint.json
          retention-days: 14

  pages-build:
    needs: plan
    if: needs.plan.outputs.pages == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .pages-workspace/.next/cache
          key: ${{ runner.os }}-pages-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-pages-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Build and audit the complete public export once
        run: pnpm build:pages
      - uses: actions/download-artifact@v4
        with:
          name: validation-plan
      - run: node scripts/ci-artifact.mjs record
      - name: Enumerate exact candidate browser inventory
        run: node scripts/ci-inventory.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: pages-test-inventory
          path: ci-inventory.json
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: static-export-pages
          path: .pages-workspace/out/
          include-hidden-files: true
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: pages-build-record
          path: ci-build.json
          retention-days: 14

  pages-browser:
    needs: [plan, pages-build]
    if: needs.plan.outputs.pages == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright@sha256:bc6ab0d6d44ff4826e4cb8c1e6d801e185bfc42bb0753f8e2a30efc70db054c7
      options: --user pwuser --shm-size=1g
    # Software-GPU shards can reach their final case after 28 minutes. Let
    # existing per-scenario deadlines and artifact verification finish.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      CI_QUALIFICATION_IMAGE: mcr.microsoft.com/playwright@sha256:bc6ab0d6d44ff4826e4cb8c1e6d801e185bfc42bb0753f8e2a30efc70db054c7
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - name: Require nonroot identity and writable runner mounts
        shell: bash
        run: |
          set -euo pipefail
          id
          test "$(id -u)" -ne 0
          test "$(id -un)" = pwuser
          for directory in "$GITHUB_WORKSPACE" "$HOME" "$RUNNER_TEMP" "$RUNNER_TOOL_CACHE"; do
            printf 'Checking writable directory: %s\n' "$directory"
            test -d "$directory"
            test -w "$directory"
          done
          printf 'Checking writable environment file: %s\n' "$GITHUB_ENV"
          test -w "$GITHUB_ENV"
          printf 'Checking writable path file: %s\n' "$GITHUB_PATH"
          test -w "$GITHUB_PATH"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify pinned browser environment
        run: node scripts/ci-image-fingerprint.mjs
      - uses: actions/download-artifact@v4
        with:
          name: validation-plan
      - uses: actions/download-artifact@v4
        with:
          name: pages-build-record
      - uses: actions/download-artifact@v4
        with:
          name: static-export-pages
          path: .pages-workspace/out
      - uses: actions/download-artifact@v4
        with:
          name: pages-test-inventory
      - name: Verify exact shared output before browser checks
        run: node scripts/ci-artifact.mjs check-build
      - run: node scripts/ci-run-pages.mjs ${{ matrix.browser }} ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-receipt-${{ matrix.browser }}-${{ strategy.job-index }}
          path: ci-receipt-*.json
          if-no-files-found: error
          retention-days: 14
      - name: Ensure tests left the public output unchanged
        run: node scripts/ci-artifact.mjs check-build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-case-review-${{ matrix.browser }}-${{ strategy.job-index }}
          path: pages-test-results/
          retention-days: 14
      - name: Retain browser environment evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-environment-pages-${{ matrix.browser }}-${{ strategy.job-index }}
          path: preflight-results/image-fingerprint.json
          retention-days: 14

  gate:
    name: Required validation gate
    needs: [plan, quality, framework, pages-build, pages-browser]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v4
        with:
          name: validation-plan
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.pages == 'true'
        with:
          name: pages-build-record
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.pages == 'true'
        with:
          name: pages-test-inventory
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.pages == 'true'
        with:
          pattern: pages-receipt-*
          path: ci-receipts
          merge-multiple: true
      - name: Require every selected job, reject unexpected skips
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
          CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/ci-gate.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: validated-release
          path: ci-validation.json
          retention-days: 14
