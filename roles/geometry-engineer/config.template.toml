# Geometry Engineer only; rendered into an isolated role home.
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "live"
[history]
persistence = "none"
[mcp_servers.geometry_review]
command = "__NODE__"
args = ["__ROLE_ROOT__/mcp/model-server.mjs"]
cwd = "__ROLE_ROOT__"
enabled_tools = ["geometry_model_record", "geometry_conversion_limits"]
startup_timeout_sec = 15
tool_timeout_sec = 20
