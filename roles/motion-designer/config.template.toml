# Motion Designer only. No inherited global MCP registrations.
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "live"
[history]
persistence = "none"
[mcp_servers.motion_review]
command = "__NODE__"
args = ["__ROLE_ROOT__/mcp/catalog-server.mjs"]
cwd = "__ROLE_ROOT__"
enabled_tools = ["motion_score","motion_chapter","motion_contract"]
startup_timeout_sec = 15
tool_timeout_sec = 20
[mcp_servers.motion_browser]
command = "__NODE__"
args = ["__ROLE_ROOT__/node_modules/@playwright/mcp/cli.js", "--browser", "chromium", "--executable-path", "__CHROMIUM__", "--headless", "--isolated", "--allowed-origins", "http://127.0.0.1:4184", "--output-dir", "__BROWSER_OUTPUT__"]
cwd = "__ROLE_ROOT__"
enabled_tools = ["browser_navigate", "browser_snapshot", "browser_press_key", "browser_take_screenshot", "browser_resize", "browser_console_messages", "browser_close"]
startup_timeout_sec = 30
tool_timeout_sec = 40
